name: Feature request
description: Suggest something we should build or change.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. We read every request. We can't build everything, but this is how good ideas reach us.

        **Do not post private information.** This issue is public.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this isn't already requested.
          required: true
        - label: This is a product idea, not an account or support question.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What are you trying to do that's hard or impossible today?
      placeholder: As a streamer, I want to… so that…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: Describe the feature or change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Workarounds, other tools, anything you're doing to cope today.
    validations:
      required: false
  - type: input
    id: product-area
    attributes:
      label: Where in the product
      description: Which part of StreamElements would this touch?
      placeholder: Chatbot
    validations:
      required: false
